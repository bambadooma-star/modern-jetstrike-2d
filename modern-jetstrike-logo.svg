<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="jetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="thrustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0054" />
      <stop offset="50%" stop-color="#ffbe0b" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Jetstrike Emblem (Scaled & Clean) -->
  <g transform="translate(2, 2) scale(0.5)">
    <!-- Targeting Crosshair Ring -->
    <circle cx="52" cy="52" r="44" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.35" />
    <circle cx="52" cy="52" r="32" stroke="#38bdf8" stroke-width="1" opacity="0.45" />

    <!-- Jet Thrust Afterburner Flames -->
    <path d="M42 76 L46 102 L50 76 Z" fill="url(#thrustGrad)" filter="url(#glow)" />
    <path d="M54 76 L58 102 L62 76 Z" fill="url(#thrustGrad)" filter="url(#glow)" />
    <circle cx="46" cy="84" r="3" fill="#ffbe0b" filter="url(#glow)" />
    <circle cx="58" cy="84" r="3" fill="#ffbe0b" filter="url(#glow)" />

    <!-- Supersonic Fighter Stealth Body -->
    <path d="M52 14 L62 42 L94 62 L94 68 L66 65 L66 78 L74 86 L74 89 L52 83 L30 89 L30 86 L38 78 L38 65 L10 68 L10 62 L42 42 Z" fill="#0f172a" stroke="url(#jetGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M52 18 L60 40 L52 64 L44 40 Z" fill="#1e293b" stroke="#00f5d4" stroke-width="1.2" />
    <polygon points="52,22 55,34 52,38 49,34" fill="#00f5d4" opacity="0.9" />
  </g>

  <!-- Clean 2-Word Typography: MODERN JETSTRIKE -->
  <g transform="translate(60, 36)">
    <text font-family="'Chakra Petch', 'Rubik', sans-serif" font-size="20" font-weight="900" letter-spacing="1">
      <tspan fill="#ffffff">MODERN </tspan>
      <tspan fill="url(#accentGrad)" filter="url(#glow)">JETSTRIKE</tspan>
    </text>
  </g>
</svg>